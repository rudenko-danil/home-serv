[build]
  publish = "."

# Source files of the generator are not part of the public site.
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"
